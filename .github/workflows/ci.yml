# Every push to main and every pull request is type-checked, tested, built, and driven in a
# browser (e2e/). A push to main that passes is then published as the web editor, on Cloudflare
# (see wrangler.jsonc).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:web
      # The licences shown under About and shipped with the installers are those of what the build holds.
      - run: pnpm notices --check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
        # The suite is still being brought up to the 1.9.1 interface: a tool is now a word
        # confirmed with Space, the drawing's name moved from the menu bar into the stage, and
        # several windows and their fields were renamed. Until every test says what the app does
        # now, a push is not refused for the ones that do not: the step still runs and its page
        # lists what fails. Type check, unit tests, the web build and `notices` keep gating.
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        # Traces of what failed, which are what a test that still describes the old interface is
        # read from.
        if: always()
        with:
          name: e2e-traces
          path: test-results
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: web
          if-no-files-found: error
          path: apps/web/dist

  deploy:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # One deployment at a time, and never one abandoned halfway.
    concurrency:
      group: deploy-web
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: apps/web/dist
      - run: npx --yes wrangler@4 deploy
        # A fork carries no Cloudflare token, and the web editor is published by "Publish the web
        # app" (pages.yml) here: with no token there is nothing to deploy, and failing the push
        # over it would report a problem that is not one.
        if: env.CLOUDFLARE_API_TOKEN != ''
