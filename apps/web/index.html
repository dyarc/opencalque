<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./icon.png" />
    <link rel="apple-touch-icon" href="./icon.png" />
    <title>AxioDraw</title>
    <style>
      /* The loading screen: a dark field, the crosshair of a drawing, and a point of light. It is
         shown from the first paint while the app's code loads, and taken away by src/splash.ts.
         Plain HTML and CSS: the Content-Security-Policy lets no script run in this page. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        overflow: hidden;
        background: #050507;
        color: #fff;
        transition: opacity 0.35s ease-out;
        user-select: none;
        -webkit-app-region: drag;
      }
      #splash.leaving {
        opacity: 0;
        pointer-events: none;
        -webkit-app-region: no-drag;
      }
      .splash-axis {
        position: absolute;
        background: rgb(255 255 255 / 38%);
        box-shadow: 0 0 12px rgb(140 180 255 / 18%);
        opacity: 0;
        animation: splash-axis 0.8s ease-out forwards;
      }
      .splash-axis.horizontal {
        top: 50%;
        left: 0;
        width: 100%;
        height: 1px;
      }
      .splash-axis.vertical {
        top: 0;
        left: 50%;
        width: 1px;
        height: 100%;
        animation-delay: 0.08s;
      }
      .splash-glow {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: radial-gradient(circle, #fff 0 18%, rgb(160 200 255 / 75%) 32%, rgb(90 140 255 / 22%) 55%, transparent 72%);
        box-shadow: 0 0 24px 8px rgb(120 170 255 / 45%), 0 0 70px 22px rgb(60 110 255 / 18%);
        transform: translate(-50%, -50%);
        opacity: 0;
        animation: splash-flash 0.24s ease-in-out 0.16s 5;
      }
      .splash-mark {
        position: absolute;
        top: calc(50% - 155px);
        left: calc(50% - 205px);
        width: 116px;
        height: 116px;
        object-fit: contain;
        opacity: 0;
        filter: drop-shadow(0 0 18px rgb(130 175 255 / 18%));
        animation: splash-in 0.9s ease-out 0.58s forwards;
      }
      .splash-tagline {
        position: absolute;
        top: calc(50% - 92px);
        left: calc(50% + 58px);
        margin: 0;
        color: rgb(236 242 255 / 88%);
        font: 300 15px/1.4 Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
        letter-spacing: 0.075em;
        white-space: nowrap;
        opacity: 0;
        animation: splash-in 0.9s ease-out 0.58s forwards;
      }
      @keyframes splash-axis {
        to {
          opacity: 1;
        }
      }
      @keyframes splash-flash {
        0%,
        100% {
          opacity: 0.12;
        }
        42% {
          opacity: 1;
        }
      }
      @keyframes splash-in {
        from {
          opacity: 0;
          transform: translateY(5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-axis,
        .splash-glow {
          animation-duration: 0.6s;
          animation-iteration-count: 1;
        }
        .splash-mark,
        .splash-tagline {
          animation-delay: 0.1s;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash" role="status" aria-label="AxioDraw">
      <div class="splash-axis horizontal"></div>
      <div class="splash-axis vertical"></div>
      <img class="splash-mark" src="./logo-mark.png" alt="" />
      <p class="splash-tagline">AxioDraw - Present Your Taste.</p>
      <div class="splash-glow"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
