<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./icon.png" />
    <link rel="apple-touch-icon" href="./icon.png" />
    <title>AxioDraw</title>
    <style>
      /* The loading screen: the mark, then the line beside it. It is shown from the first paint
         while the app's code loads, and taken away by src/splash.ts. Plain HTML and CSS: the
         Content-Security-Policy lets no script run in this page. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        overflow: hidden;
        background: #050507;
        color: #fff;
        transition: opacity 0.35s ease-out;
        user-select: none;
        -webkit-app-region: drag;
      }
      #splash.leaving {
        opacity: 0;
        pointer-events: none;
        -webkit-app-region: no-drag;
      }
      .splash-lockup {
        position: absolute;
        top: 50%;
        left: 50%;
        display: flex;
        align-items: center;
        gap: 30px;
        transform: translate(-50%, -50%);
      }
      .splash-mark {
        width: 190px;
        height: 190px;
        object-fit: contain;
        opacity: 0;
        filter: drop-shadow(0 0 22px rgb(140 175 255 / 16%));
        animation: splash-mark-in 1s ease-out 0.15s forwards;
      }
      .splash-tagline {
        margin: 0;
        color: rgb(238 243 255 / 82%);
        font: 300 12px/1.5 Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
        letter-spacing: 0.14em;
        white-space: nowrap;
        opacity: 0;
        animation: splash-line-in 1.1s ease-out 1.45s forwards;
      }
      @keyframes splash-mark-in {
        from {
          opacity: 0;
          transform: scale(0.94);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes splash-line-in {
        from {
          opacity: 0;
          transform: translateX(-6px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
      @media (max-width: 640px) {
        .splash-lockup {
          flex-direction: column;
          gap: 18px;
        }
        .splash-mark {
          width: 150px;
          height: 150px;
        }
        .splash-tagline {
          font-size: 11px;
          letter-spacing: 0.1em;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-mark,
        .splash-tagline {
          animation-duration: 0.01s;
          animation-delay: 0s;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash" role="status" aria-label="AxioDraw">
      <div class="splash-lockup">
        <img class="splash-mark" src="./logo-mark.png" alt="" />
        <p class="splash-tagline">AxioDraw - Present Your Taste.</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
